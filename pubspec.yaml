name: s_button
description: "A customizable button widget that supports various interactions and visual effects (splash, hover, focus, and press)."
version: 2.0.4
homepage: https://github.com/SoundSliced/s_button
repository: https://github.com/SoundSliced/s_button
issue_tracker: https://github.com/SoundSliced/s_button/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  s_packages: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true